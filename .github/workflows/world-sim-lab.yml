name: World simulation laboratory

on:
  push:
    branches:
      - analysis/world-simulation-lab
  pull_request:
    branches:
      - claude/core-world-economy

permissions:
  contents: read

jobs:
  lab-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: All existing and new tests
        run: python -m pytest -q
      - name: Generate one-world sample diagnostics
        run: python scripts/world_sim_lab.py --worlds 1 --seasons 1 --clubs 24 --output world-lab-smoke
      - name: Upload sample CSV and JSON reports
        uses: actions/upload-artifact@v4
        with:
          name: world-lab-smoke
          path: world-lab-smoke/
          retention-days: 14
