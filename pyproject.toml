[project]
name = "csmcore"
version = "0.0.1"
description = "Simulation core for an esports manager game: tactical FPS match engine calibrated on real match data."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["demoparser2", "pandas", "pyarrow"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
